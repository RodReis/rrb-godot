# Site publico + download do jogo + roadmap completo (#237). TLS fica no proxy do Coolify.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ZIPs do jogo: pasta do host montada pelo compose (o release.yml envia o ZIP da tag para la).
    location /download/ {
        alias /srv/download/;
        autoindex on;
        autoindex_exact_size off;
        add_header Cache-Control "no-cache";
    }

    location /roadmap/ {
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
