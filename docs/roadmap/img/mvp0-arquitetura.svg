<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Outfit, 'Segoe UI', sans-serif">
  <rect width="800" height="400" fill="#0B1326"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D8C3AD"/>
    </marker>
  </defs>
  <!-- container docker -->
  <rect x="230" y="28" width="340" height="150" rx="8" fill="none" stroke="#3198DC" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="246" y="52" fill="#93CCFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">CONTAINER DOCKER · tc netem</text>
  <!-- servidor -->
  <rect x="280" y="68" width="240" height="88" rx="8" fill="#171F33" stroke="#F59E0B" stroke-width="3"/>
  <text x="400" y="104" fill="#FFC174" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" text-anchor="middle">SERVIDOR</text>
  <text x="400" y="130" fill="#DAE2FD" font-size="15" text-anchor="middle">sem tela · decide tudo · 30 Hz</text>
  <!-- clientes -->
  <rect x="60" y="268" width="230" height="96" rx="8" fill="#171F33" stroke="#534434" stroke-width="2"/>
  <text x="175" y="304" fill="#DAE2FD" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">CLIENTE 1</text>
  <text x="175" y="330" fill="#D8C3AD" font-size="15" text-anchor="middle">jogador · predição local</text>
  <rect x="510" y="268" width="230" height="96" rx="8" fill="#171F33" stroke="#534434" stroke-width="2"/>
  <text x="625" y="304" fill="#DAE2FD" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">CLIENTE 2</text>
  <text x="625" y="330" fill="#D8C3AD" font-size="15" text-anchor="middle">piloto automático</text>
  <!-- setas -->
  <line x1="190" y1="264" x2="300" y2="162" stroke="#D8C3AD" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="166" x2="222" y2="266" stroke="#22C55E" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="264" x2="500" y2="162" stroke="#D8C3AD" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="166" x2="578" y2="266" stroke="#22C55E" stroke-width="2" marker-end="url(#a)"/>
  <text x="140" y="214" fill="#D8C3AD" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">comandos</text>
  <text x="318" y="232" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="12">estado</text>
  <text x="660" y="214" fill="#D8C3AD" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">comandos</text>
  <text x="482" y="232" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">estado</text>
  <!-- legenda rede -->
  <rect x="300" y="352" width="200" height="34" rx="4" fill="#222A3D"/>
  <text x="400" y="374" fill="#FFC174" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">50 ms + 50 ms · 2% perda</text>
</svg>
