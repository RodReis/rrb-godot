name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      game: ${{ steps.filter.outputs.game }}
      launcher: ${{ steps.filter.outputs.launcher }}
      shared: ${{ steps.filter.outputs.shared }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
      site: ${{ steps.filter.outputs.site }}
      gd_files: ${{ steps.filter.outputs.gd_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          # Fonte: docs/CI-PR.md §3. infra (workflow, scripts de CI, config de lint) prova tudo.
          filters: |
            game: ['game/**', 'tools/test.ps1', 'tools/link-shared.ps1']
            launcher: ['launcher/**', 'tools/test.ps1', 'tools/link-shared.ps1']
            shared: ['shared/**']
            backend: ['backend/**']
            infra: ['infra/**', '.github/**', 'tools/ci/**']
            docs: ['docs/**', '*.md']
            site: ['site/**', 'tools/roadmap/**', 'shared/data/heroes/**', 'docs/roadmap/historia.json', 'docs/STATUS.md']
            gd:
              - added|modified: '**/*.gd'

  lint-gd:
    needs: changes
    if: >-
      needs.changes.outputs.game == 'true' || needs.changes.outputs.launcher == 'true' ||
      needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GD_FILES: ${{ needs.changes.outputs.gd_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar gdtoolkit
        run: pip install --quiet 'gdtoolkit==4.*'

      - name: .gd tocados (fora de addons/)
        run: |
          files=$(printf '%s\n' $GD_FILES | grep '\.gd$' | grep -v '/addons/' || true)
          echo "$files"
          echo "LINT_FILES=$(echo $files)" >> "$GITHUB_ENV"

      - name: gdlint
        if: env.LINT_FILES != ''
        run: gdlint $LINT_FILES

      - name: gdformat --check
        if: ${{ !cancelled() && env.LINT_FILES != '' }}
        run: gdformat --check --diff $LINT_FILES

      - name: Literal numérico fora de constante em core/ (I4)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/ci/no-magic-numbers.ps1

      - name: Launcher sem netfox/ENet/arena (I9)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d launcher ]; then echo "launcher/ ainda não existe"; exit 0; fi
          # Referencia de codigo, nao texto: o credito do netfox (aba Creditos, F24) cita o nome.
          if grep -rnE 'addons/netfox|Network(Time|Rollback|Events|Performance)|RollbackSynchronizer|StateSynchronizer|BaseNetInput|ENetMultiplayerPeer|res://scenes/arena' launcher \
              --exclude-dir=shared --exclude-dir=.godot; then
            echo "FALHA: launcher/ referencia o Game (I9)"; exit 1
          fi

      - uses: ./.github/actions/godot
        if: ${{ !cancelled() && env.LINT_FILES != '' }}
        with:
          version: ${{ env.GODOT_VERSION }}

      # untyped_declaration = erro no project.godot: o compilador do Godot é a prova de tipagem.
      # --check-only não carrega autoloads (netfox), por isso compila com o projeto de pé.
      - name: Tipagem estática (compila no Godot)
        if: ${{ !cancelled() && env.LINT_FILES != '' }}
        run: |
          failed=0
          for project in game launcher; do
            [ -d "$project" ] || continue
            # game/x.gd -> res://x.gd; shared/x.gd -> res://shared/x.gd (link).
            mine=$(printf '%s\n' $LINT_FILES | grep -E "^($project|shared)/" \
              | sed -E "s#^$project/#res://#; s#^shared/#res://shared/#" || true)
            [ -n "$mine" ] || continue
            "$GODOT_PATH" --headless --path "$project" --import > /dev/null 2>&1 || true
            "$GODOT_PATH" --headless --path "$project" -s "$PWD/tools/ci/check_scripts.gd" -- $mine \
              || failed=1
          done
          exit $failed

  test-game:
    needs: changes
    if: >-
      needs.changes.outputs.game == 'true' || needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Testes GUT (game/test + shared/test)
        shell: pwsh
        run: ./tools/test.ps1 -Module game

  test-launcher:
    needs: changes
    if: >-
      needs.changes.outputs.launcher == 'true' || needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # GUT de launcher/test + shared/test; o smoke (test_smoke_scenes.gd) instancia cada .tscn
      # do Launcher e a galeria do design system.
      - name: Testes GUT e smoke de telas (launcher/test + shared/test)
        shell: pwsh
        run: ./tools/test.ps1 -Module launcher

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rrb
          POSTGRES_PASSWORD: rrb
          POSTGRES_DB: rrb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rrb -d rrb_test" --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://rrb:rrb@localhost:5432/rrb_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: tsc --noEmit
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Jest unit (cobertura >= 80 % em *.service.ts)
        if: ${{ !cancelled() }}
        run: pnpm test:cov
      - name: Jest e2e (Postgres do services)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e
      - name: openapi.json versionado bate com o gerado
        if: ${{ !cancelled() }}
        run: pnpm build && pnpm openapi && git diff --exit-code openapi.json

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: roadmap parser (tools/roadmap)
        run: node --test ../tools/roadmap/build-roadmap.test.mjs
      - run: pnpm build

  gate:
    runs-on: ubuntu-latest
    needs: [changes, lint-gd, test-game, test-launcher, test-backend, site]
    if: always()
    steps:
      # Job pulado por path filter conta como sucesso; changes pulado ou falho, não.
      - name: Falha se algum job necessário falhou ou foi cancelado
        if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "gate verde"
