name: release

# Publica o instalador do Loot Start (F83, ADR-0023) num GitHub Release e no VPS ao empurrar uma tag v*
# (GITHUB.md §8): pacote do build-package.ps1 -> makensis (tools/installer/lootstart.nsi) -> latest.json.
# A tag e anotada, criada na main com CI verde — este workflow nao reverifica isso.
# Antes da primeira tag: Settings > Variables > RRB_API_URL = URL publica do backend (https://...).

on:
  push:
    tags: ['v*']
  # Ensaio manual: gera o instalador e o anexa ao run como artefato, sem criar Release.
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  # Download publico do jogo (#237): o repo e o Release do GitHub sao privados; o instalador vai para o VPS.
  VPS_HOST: lootstart.cloud

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: URL do backend configurada
        env:
          RRB_API_URL: ${{ vars.RRB_API_URL }}
        run: |
          if [ -z "$RRB_API_URL" ]; then
            echo "::error::Defina a variavel de repositorio RRB_API_URL (URL publica do backend)."
            exit 1
          fi

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # Cliente Windows exportado a partir do Linux: so o template windows_release_x86_64 e preciso.
      - name: Export templates (Windows)
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          curl -fsSL -o /tmp/tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/tpl.tpz 'templates/version.txt' 'templates/windows_release_x86_64.exe' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$dir/"

      - name: Gerar o pacote
        shell: pwsh
        env:
          RRB_API_URL: ${{ vars.RRB_API_URL }}
          # Nome de tag e entrada nao confiavel: vai por variavel de ambiente, nunca no texto do script.
          RRB_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: ./tools/build-package.ps1 -ApiUrl $env:RRB_API_URL -Version $env:RRB_VERSION

      # NSIS no proprio runner Linux; VERSION_NUM (X.Y.Z.0) vai para os metadados do Setup.exe.
      - name: Gerar o instalador
        env:
          RRB_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          num=$(printf '%s' "$RRB_VERSION" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1.0/p')
          makensis -V2 -DVERSION="$RRB_VERSION" -DVERSION_NUM="${num:-0.0.0.0}" \
            -DSRC="$PWD/build/package" -DOUT="$PWD/build/LootStart-Setup-$RRB_VERSION.exe" \
            "$PWD/tools/installer/lootstart.nsi"  # absoluto: o makensis muda para a pasta do script

      - name: Anexar o instalador (ensaio)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: LootStart-Setup-dev
          path: build/LootStart-Setup-dev.exe
          retention-days: 3

      # F86 (ADR-0024, SPEC-086): ZIP portatil do canal itch.io, sem atualizador proprio. Vem depois do
      # makensis porque o build-package.ps1 apaga build/package; o ZIP do canal site nao e publicado.
      - name: Gerar o ZIP do itch.io
        shell: pwsh
        env:
          RRB_API_URL: ${{ vars.RRB_API_URL }}
          RRB_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: ./tools/build-package.ps1 -ApiUrl $env:RRB_API_URL -Version $env:RRB_VERSION -Channel itch

      - name: Anexar o ZIP do itch.io
        uses: actions/upload-artifact@v4
        with:
          name: LootStart-itch-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          path: build/LootStart-*-win64.zip
          retention-days: ${{ github.ref_type == 'tag' && 7 || 3 }}

      - name: Publicar o Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          ## Como instalar
          1. Baixe `LootStart-Setup-*.exe` e abra.
          2. O jogo instala na sua pasta de usuário, sem pedir administrador, e cria atalhos no Menu
             Iniciar e na Área de Trabalho. Abra o Loot Start, crie a conta, entre na fila e jogue.
          3. Versões novas: o Launcher avisa ao abrir e se atualiza sozinho.

          **Aviso do Windows (SmartScreen):** o executável não tem assinatura de código, então aparece
          "O Windows protegeu seu computador". Clique em **Mais informações** e depois em
          **Executar assim mesmo**.

          ## O que mudou
          NOTES
          gh release create "$TAG" "build/LootStart-Setup-${TAG}.exe" \
            --title "$TAG" --notes-file /tmp/notes.md --generate-notes --prerelease

      # Download publico (#237, F83): https://lootstart.cloud/download/LootStart-Setup.exe (atalho) e o
      # manifesto latest.json que o Launcher le. O manifesto vai por ultimo (rename atomico): nunca
      # aponta para um instalador que ainda nao subiu.
      # Chave so de upload (usuario rrbdl no VPS), segredo VPS_UPLOAD_KEY; host fixo em infra/known_hosts.
      - name: Enviar o instalador para o VPS
        if: github.ref_type == 'tag'
        env:
          UPLOAD_KEY: ${{ secrets.VPS_UPLOAD_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPLOAD_KEY" ]; then
            echo "::error::Defina o segredo VPS_UPLOAD_KEY (chave do usuario rrbdl no VPS)."
            exit 1
          fi
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "::error::tag invalida: $TAG"; exit 1;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$UPLOAD_KEY" > ~/.ssh/upload_key
          chmod 600 ~/.ssh/upload_key
          grep -v '^#' infra/known_hosts > ~/.ssh/known_hosts
          setup="LootStart-Setup-${TAG}.exe"
          sha=$(sha256sum "build/$setup" | cut -d' ' -f1)
          printf '{"version":"%s","installer":"%s","sha256":"%s"}\n' "$TAG" "$setup" "$sha" > build/latest.json
          dir=/srv/rrb-download
          scp -i ~/.ssh/upload_key "build/$setup" "rrbdl@${VPS_HOST}:$dir/$setup"
          scp -i ~/.ssh/upload_key build/latest.json "rrbdl@${VPS_HOST}:$dir/latest.json.tmp"
          ssh -i ~/.ssh/upload_key "rrbdl@${VPS_HOST}" \
            "ln -sfn $setup $dir/LootStart-Setup.exe && mv -f $dir/latest.json.tmp $dir/latest.json"

  # F86 (SPEC-086): envia o ZIP ao itch.io com o butler. Job separado: falha aqui nao desfaz o Release
  # nem o envio ao VPS, e da para rodar de novo sozinho. Precisa do segredo BUTLER_API_KEY e da variavel
  # ITCH_TARGET (usuario/projeto) — o PI grava; sem eles o job falha com erro explicito.
  itch:
    needs: package
    # !cancelled(): roda mesmo se o package falhar depois de anexar o ZIP (ex.: VPS fora do ar, v0.4.0).
    # Se falhar antes do ZIP, o download-artifact falha com erro explicito.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Versao fixada do butler (https://broth.itch.zone/butler); sem 'LATEST'.
      BUTLER_VERSION: 15.21.0
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LootStart-itch-${{ github.ref_name }}
          path: build

      - name: Enviar o ZIP com o butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
          # Nome de tag e entrada nao confiavel: vai por variavel de ambiente, nunca no texto do script.
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Defina o segredo BUTLER_API_KEY (API key do itch.io)."
            exit 1
          fi
          if [ -z "$ITCH_TARGET" ]; then
            echo "::error::Defina a variavel de repositorio ITCH_TARGET (usuario/projeto do itch.io)."
            exit 1
          fi
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "::error::tag invalida: $TAG"; exit 1;; esac
          case "$ITCH_TARGET" in *[!A-Za-z0-9._/-]*) echo "::error::ITCH_TARGET invalido (usuario/projeto)."; exit 1;; esac
          curl -fsSL -o /tmp/butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push "build/LootStart-${TAG}-win64.zip" "${ITCH_TARGET}:windows" \
            --userversion "$TAG"
