; Modelo de game/export_presets.cfg (o arquivo real fica fora do git — GITHUB.md §10).
; tools/export-presets.ps1 e infra/gameserver/Dockerfile copiam este modelo.
; Caminhos relativos a game/. Desligado: rcedit (sem icone/metadados no .exe) e assinatura.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="test/*, addons/gut/*, shared/test/*"
export_path="../build/game/game.exe"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/modify_resources=true
application/product_name="Loot Start"
application/file_description="Loot Start"
codesign/enable=false

[preset.1]

name="Linux Server"
platform="Linux"
runnable=false
advanced_options=false
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="test/*, addons/gut/*, shared/test/*"
export_path="../build/server/game.x86_64"
script_export_mode=2

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
