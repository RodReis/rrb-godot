; Modelo de launcher/export_presets.cfg (o arquivo real fica fora do git — GITHUB.md §10).
; F82 (ADR-0022): executavel LootStart.exe; icone e metadados do .exe vem do icon.svg e de application/*.
; tools/export-presets.ps1 copia este modelo. Caminhos relativos a launcher/.
; build_config.cfg (URL do backend) e gerado por tools/build-package.ps1 e entra no .pck.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="build_config.cfg"
exclude_filter="test/*, addons/gut/*, shared/test/*"
export_path="../build/LootStart.exe"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/modify_resources=true
application/product_name="Loot Start"
application/file_description="Loot Start"
codesign/enable=false
